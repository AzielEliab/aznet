name = "aznet-download-tracker"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true
account_id = "ac575a9b822bea2bed97d0ab73aed238"

# Parent binds AZNET_DOWNLOADS as DOWNLOADS on first deploy.
[[kv_namespaces]]
binding = "DOWNLOADS"
id = "00000000000000000000000000000001"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/", "/download", "/download/*", "/stats", "/event", "/go", "/count", "/install.sh", "/v1", "/v1/*", "/openapi.json", "/ai", "/ai/*", "/mcp", "/mcp/", "/cite", "/cite/", "/cite.json", "/sitemap.xml", "/robots.txt", "/llms.txt", "/ai.txt"]

[observability]
enabled = true
head_sampling_rate = 1
